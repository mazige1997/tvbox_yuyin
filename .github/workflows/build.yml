name: Build TVBox APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-java:
    name: 编译 java 版 (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 11 (AGP 7.2.2 要求)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 生成 local.properties (Chaquopy配置阶段必需, SDK走ANDROID_HOME检测)
        run: |
          cat > local.properties << 'EOF'
          # CI-generated: sdk auto-detected via ANDROID_HOME
          EOF

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: "编译 java flavor (armeabi-v7a + arm64-v8a 双ABI)"
        run: ./gradlew :app:assembleJavaDebug :app:assembleJavaRelease --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/java/*/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-java-apk
          path: app/build/outputs/apk/java/*/*.apk
          if-no-files-found: error
          retention-days: 30

  build-python:
    # python flavor 依赖 Chaquopy(需本机Python 3.8构建), 单独编译, 失败不影响 java 版产物
    name: 编译 python 版 (release)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.8 (Chaquopy 12 构建依赖)
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: 安装 JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 生成 local.properties (Chaquopy配置阶段必需)
        run: |
          cat > local.properties << 'EOF'
          # CI-generated: sdk auto-detected via ANDROID_HOME
          EOF

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 (python flavor)
        run: ./gradlew :app:assemblePythonRelease --stacktrace
        env:
          BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python3.8

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/python/*/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-python-apk
          path: app/build/outputs/apk/python/*/*.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    # 主分支推送 → 滚动更新 latest 预发布; 打 v* 标签 → 正式 Release
    name: 发布 APK 到 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-java, build-python]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: TVBox-*-apk
          merge-multiple: true
          path: apks

      - name: 列出待发布 APK
        run: ls -lh apks/

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apks
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            echo "发布正式 Release: $TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" --clobber TVBox_*.apk
            else
              gh release create "$TAG" --title "TVBox $TAG" --generate-notes TVBox_*.apk
            fi
          else
            TAG="latest"
            echo "滚动更新 latest 预发布 (commit: $GITHUB_SHA)"
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "TVBox 最新构建" \
              --notes "自动构建于 commit ${GITHUB_SHA:0:7} ($(date '+%Y-%m-%d %H:%M UTC'))

          - TVBox_debug-java.apk: debug版, 可直接安装
          - TVBox_release-java.apk: release版, 未签名, 安装前需自行签名
          - TVBox_release-python.apk: 内置Python引擎版(若本次构建成功)" \
              --prerelease \
              TVBox_*.apk
          fi

      - name: 输出发布结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName,isPrerelease,assets --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[].name]}'
