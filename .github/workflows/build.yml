name: Build TVBox APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-java:
    name: 编译 java 版 (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 JDK 11 (AGP 7.2.2 要求)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 生成 local.properties (Chaquopy配置阶段必需, SDK走ANDROID_HOME检测)
        run: |
          cat > local.properties << 'EOF'
          # CI-generated: sdk auto-detected via ANDROID_HOME
          EOF

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 java 各flavor (universal双ABI / java32位 / java64位)
        run: ./gradlew :app:assembleJavaDebug :app:assembleJavaRelease :app:assembleJava32Release :app:assembleJava64Release --stacktrace

      - name: 列出产物
        run: ls -lhR app/build/outputs/apk/

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: TVBox-java-apk
          path: app/build/outputs/apk/java*/**/*.apk
          if-no-files-found: error
          retention-days: 30

  build-python:
    # python flavor 依赖 Chaquopy(需本机Python 3.8构建), 单独编译, 失败不影响 java 版产物
    # 编译python32/python64(完整包含src/python/java源码, universal python flavor不含该源码目录)
    name: 编译 python 版 (release, 32位+64位)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.8 (Chaquopy 12 构建依赖)
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: 安装 JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 生成 local.properties (Chaquopy配置阶段必需)
        run: |
          cat > local.properties << 'EOF'
          # CI-generated: sdk auto-detected via ANDROID_HOME
          EOF

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 (python32 + python64 flavor)
        run: ./gradlew :app:assemblePython32Release :app:assemblePython64Release --stacktrace
        env:
          BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python3.8

      - name: 列出产物
        run: ls -lhR app/build/outputs/apk/

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: TVBox-python-apk
          path: app/build/outputs/apk/python*/**/*.apk
          if-no-files-found: warn
          retention-days: 30

  release:
    # 主分支推送 → 滚动更新 latest 预发布; 打 v* 标签 → 正式 Release
    name: 发布 APK 到 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-java, build-python]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: TVBox-*-apk
          merge-multiple: true
          path: apks

      - name: 删除旧的 latest 预发布 (仅主分支推送, 让tag重新指向最新commit)
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: 生成发布说明
        shell: bash
        run: |
          printf '自动构建于 commit %s (%s)\n\n- TVBox_debug-java-universal.apk: debug版(32+64位合并), 已签名, 可直接安装\n- TVBox_release-java-universal.apk: release版(32+64位合并), 已签名, 可直接安装\n- TVBox_release-java32-arm32.apk: release版 32位专用(体积更小)\n- TVBox_release-java64-arm64.apk: release版 64位专用(体积更小)\n- TVBox_release-python32-arm32.apk / TVBox_release-python64-arm64.apk: 内置Python引擎版(若本次构建成功)\n- 全部APK使用固定密钥签名, 后续构建可覆盖升级\n' \
            "${GITHUB_SHA:0:7}" "$(date '+%Y-%m-%d %H:%M UTC')" > release_notes.md

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('TVBox {0}', github.ref_name) || 'TVBox 最新构建' }}
          body_path: release_notes.md
          generate_release_notes: true
          files: apks/**/*.apk
          fail_on_unmatched_files: true
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
