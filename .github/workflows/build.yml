name: Build TVBox APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-java:
    name: 编译 java 版 (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 11 (AGP 7.2.2 要求)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: "编译 java flavor (armeabi-v7a + arm64-v8a 双ABI)"
        run: ./gradlew :app:assembleJavaDebug :app:assembleJavaRelease --stacktrace

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/java/*/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-java-apk
          path: app/build/outputs/apk/java/*/*.apk
          if-no-files-found: error
          retention-days: 30

  build-python:
    # python flavor 依赖 Chaquopy(需本机Python 3.8构建), 单独编译, 失败不影响 java 版产物
    name: 编译 python 版 (release)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8 (Chaquopy 12 构建依赖)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 (python flavor)
        run: ./gradlew :app:assemblePythonRelease --stacktrace
        env:
          BUILD_PYTHON: ${{ env.pythonLocation }}/bin/python3.8

      - name: 列出产物
        run: ls -lh app/build/outputs/apk/python/*/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-python-apk
          path: app/build/outputs/apk/python/*/*.apk
          if-no-files-found: warn
          retention-days: 30
